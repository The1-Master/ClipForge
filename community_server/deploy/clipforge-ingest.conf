# Install as a NEW nginx conf.d file; never modify existing sites or ACME renewal.
limit_req_zone $binary_remote_addr zone=clipforge_ip_requests:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=clipforge_ip_connections:1m;
log_format clipforge_safe '$time_iso8601 $request_method $status $body_bytes_sent';

server {
    listen 9443 ssl;
    server_name 157.173.114.38;
    ssl_certificate /opt/credenta-review/acme/live/credenta-ip/fullchain.pem;
    ssl_certificate_key /opt/credenta-review/acme/live/credenta-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/clipforge-access.log clipforge_safe;
    error_log /var/log/nginx/clipforge-error.log crit;
    client_max_body_size 8m;
    client_body_buffer_size 128k;
    client_body_timeout 30s;
    keepalive_timeout 5s;
    limit_conn clipforge_ip_connections 4;
    limit_conn_status 429;
    limit_req_status 429;
    limit_req zone=clipforge_ip_requests burst=20 nodelay;
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;

    error_page 413 = @clipforge_large;
    error_page 429 = @clipforge_busy;
    error_page 400 403 404 405 414 431 494 495 496 497 = @clipforge_invalid;
    error_page 408 500 502 503 504 = @clipforge_unavailable;
    location @clipforge_large { return 413 '{"error":"body_too_large"}'; }
    location @clipforge_busy { return 429 '{"error":"rate_limited"}'; }
    location @clipforge_invalid { return 400 '{"error":"invalid_request"}'; }
    location @clipforge_unavailable { return 503 '{"error":"receiver_unavailable"}'; }
    location /v1/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host 157.173.114.38;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Server;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }
    location / { return 404 '{"error":"not_found"}'; }
}

